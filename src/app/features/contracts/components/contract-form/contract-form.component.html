<h2>Agregar Contrato</h2>
<form (submit)="addContract()">
  <input type="text" placeholder="Nombre del Cliente" >
  <input type="email" placeholder="Correo del Cliente" >
  <input type="date" placeholder="Fecha de Inicio" >
  <input type="date" placeholder="Fecha de Vencimiento" >
  <button type="submit">Agregar Contrato</button>
</form>
